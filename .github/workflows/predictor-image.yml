# Builds the Prediction Lab worker image (ARM for the AWS t4g server, and x86) and publishes it to GitHub Container
# Registry as ghcr.io/caankitgargsitools/ankgenie-predictor. The server's Watchtower picks up new versions by itself.
name: predictor image

on:
  push:
    branches: [main]
    paths: ["predictor/**", ".github/workflows/predictor-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test the worker (stand-in model, no network)
        run: pip install numpy==1.26.4 && python predictor/tests/test_predictor.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: predictor/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ankgenie-predictor:latest
            ghcr.io/${{ github.repository_owner }}/ankgenie-predictor:${{ github.sha }}
